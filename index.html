<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانلود اپ مدیریت زمان زمان‌یار | TimeYar</title>
<meta name="description" content="اپلیکیشن فارسی مدیریت زمان و عادت‌سازی">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F4F2;--surface:#FFF;--inverse:#0A0A0A;--text:#0A0A0A;--muted:#6B6B6B;--stroke:#E2E2E0;--font:"Vazirmatn",system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);text-align:center;}
.container{max-width:800px;margin:0 auto;padding:3rem 1.25rem;}
h1{font-size:2.5rem;margin-bottom:0.5rem;}
.lead{color:var(--muted);font-size:1.15rem;margin-bottom:2rem;}
.phones{display:flex;justify-content:center;gap:1.5rem;margin:2rem 0;flex-wrap:wrap;}
.phone{width:180px;height:360px;background:var(--inverse);border-radius:24px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.9rem;}
.downloads{margin:2.5rem 0;}
.store{display:inline-block;background:var(--inverse);color:#fff;padding:0.9rem 1.5rem;margin:0.5rem;text-decoration:none;border-radius:10px;font-weight:600;}
footer{margin-top:3rem;color:var(--muted);font-size:0.85rem;}
</style>
</head>
<body>
<div class="container">
  <h1>زمان‌یار</h1>
  <p class="lead">تمرکز کنید. عادت بسازید. زمانتان را پس بگیرید.</p>
  <div class="phones">
    <div class="phone">صفحه اصلی<br>تایمر تمرکز</div>
    <div class="phone">گزارش هفتگی<br>پیشرفت عادت‌ها</div>
  </div>
  <div class="downloads">
    <a href="#" class="store">دانلود از کافه بازار</a>
    <a href="#" class="store">دانلود از مایکت</a>
    <a href="#" class="store">نسخه وب</a>
  </div>
  <footer>اپلیکیشن موبایل • Minimal Mono • Beig-Rules</footer>
</div>
</body>
</html>
